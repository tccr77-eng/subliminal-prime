name: SafeSweep Android build

on:
  push:
    paths:
      - "safesweep-android/**"
      - ".github/workflows/safesweep-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safesweep-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run safety tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk SafeSweep.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SafeSweep-apk
          path: safesweep-android/SafeSweep.apk

      - name: Publish release (download this on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: safesweep-v1.0.${{ github.run_number }}
          name: SafeSweep 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: safesweep-android/SafeSweep.apk
          body: |
            Open this page on your Android phone, tap **SafeSweep.apk**, then Install.
            (Allow "Install unknown apps" for your browser if Android asks.)
